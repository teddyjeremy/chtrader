name: Coin 1 lifecycle research
on:
  push:
    branches:
      - research/coin-one-lifecycle
    paths:
      - "scripts/research/coin-one.ts"
      - ".github/workflows/coin-one-research.yml"
permissions:
  contents: read
concurrency:
  group: coin-one-lifecycle-research
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Collect mint history and market snapshot
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          MAX_SIGNATURES: "100000"
        run: npx tsx scripts/research/coin-one.ts
      - name: Upload coin lifecycle dataset
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coin-one-lifecycle-${{ github.run_id }}
          path: data/coin-one/
          if-no-files-found: warn
          retention-days: 30
