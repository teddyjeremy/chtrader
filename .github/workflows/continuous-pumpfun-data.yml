name: Continuous Pump.fun market data

on:
  push:
    branches: [main]
    paths:
      - "scripts/research/collect-pumpfun-stream.ts"
      - "scripts/research/paper-trading.ts"
      - ".github/workflows/continuous-pumpfun-data.yml"
  schedule:
    - cron: "5,20,35,50 * * * *"
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Maximum 1000-signature pages to discover per run; small incremental polls"
        required: true
        default: "20"
        type: string

permissions:
  contents: write

concurrency:
  group: continuous-pumpfun-market-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Validate research scripts compile
        run: >-
          npx tsc --noEmit --target ES2022 --module NodeNext
          --moduleResolution NodeNext --skipLibCheck --types node
          scripts/research/collect-pumpfun-stream.ts
          scripts/research/paper-trading.ts

      - name: Collect and checkpoint Pump.fun transactions
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          MAX_PAGES: ${{ inputs.max_pages || '20' }}
        run: npx tsx scripts/research/collect-pumpfun-stream.ts

      - name: Rebuild $1 paper signals and ledger
        if: always()
        run: npx tsx scripts/research/paper-trading.ts

      - name: Commit dataset, paper results and resumable progress
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pumpfun-stream/
          if git diff --cached --quiet; then
            echo "No dataset, paper results or checkpoint changes to commit."
          else
            git commit -m "data: update Pump.fun research and paper ledger $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Publish collection and paper report
        if: always()
        run: |
          echo "## Continuous Pump.fun collection and paper trading" >> "$GITHUB_STEP_SUMMARY"
          for report in data/pumpfun-stream/latest-poll-report.json data/pumpfun-stream/paper-trading-report.json; do
            if [ -f "$report" ]; then
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "### $report" >> "$GITHUB_STEP_SUMMARY"
              cat "$report" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
