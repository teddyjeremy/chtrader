name: Continuous Pump.fun market data

on:
  schedule:
    - cron: "5,20,35,50 * * * *"
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Maximum 1000-signature pages to walk back to the last checkpoint"
        required: true
        default: "20"
        type: string

permissions:
  contents: write

concurrency:
  group: continuous-pumpfun-market-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Collect new finalized Pump.fun transactions
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          MAX_PAGES: ${{ inputs.max_pages || '20' }}
        run: npx tsx scripts/research/collect-pumpfun-stream.ts

      - name: Commit new dataset and checkpoint
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pumpfun-stream/
          if git diff --cached --quiet; then
            echo "No new data to commit."
          else
            git commit -m "data: append Pump.fun stream $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin HEAD:main
          fi

      - name: Publish collection report
        if: always()
        run: |
          echo "## Continuous Pump.fun collection" >> "$GITHUB_STEP_SUMMARY"
          if [ -f data/pumpfun-stream/latest-poll-report.json ]; then
            cat data/pumpfun-stream/latest-poll-report.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No collection report was produced. Inspect the collector logs." >> "$GITHUB_STEP_SUMMARY"
          fi
